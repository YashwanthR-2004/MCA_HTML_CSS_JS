<!DOCTYPE html>
<html>
    <head>
        <title>Text tags</title>
    </head>
    <body>
        <!--Heading tags-->
        <h1>heading1</h1>
        <h2>heading2</h2>
        <h3>heading3</h3>
        <h4>heading4</h4>
        <h5>heading5</h5>
        <h6>heading6</h6>
        <!--Paragraph tags-->
        <p>This is a paragraph of text. It provides information about the topic being discussed.</p>
        <b>Bold Tags</b>
        <strong>Important Tags </strong>
        <br> <!--Line break tag-->
        <i>Italic Tags</i>
        <br>
        <em>Emphasized Tags</em>
        <br>
        <u>Underline Tags</u>
        <br>
        <mark>Highlights</mark>
        <br>
        <small>Small Text</small>
        <br>
        <del>Deleted Text</del>
        <br>
        <ins>Inserted Text</ins>
    </body>
</html>

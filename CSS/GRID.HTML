<html>
    <head>
        <title>Flex Box</title>

        .container{
            font-size:30px;
            display:grid;
            grid-template-columns: auto auto auto ;

        }
        .container div{
            font-size:20px;
            border:3px solid black;
            background-color:lightblue;
            margin:20px;
            padding:20;  
            text-align:center;

        }
    </style>
    <body>
        <div class ="container">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
            <div>Item 6</div>
            <div>Item 7</div>
            <div>Item 8</div>
            <div>Item 9</div>

        </div>
    </body>
</html>

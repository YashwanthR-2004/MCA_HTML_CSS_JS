<!DOCTYPE html>
<html>
    <head>
        <title>Flex Box</title>
    </head>
    <style>
        .container{
            font-size:20px;
            background-color:lightgray;
            display:flex;
            flex-direction:column;
        }
        .container div{
            background-color:lightblue;
            margin:10px;
            padding:20px;
            border:3px solid black;
        }
    </style>
    <body>
        <div class ="container">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Event Listening Handling</title>
    </head>
    <body>
        <button id="btn">Click Me....!</button>
        <script>
            let element = document.getElementById("btn");
            element.addEventListener("click", function(){
                alert("Button Clicked")
            });
            element.addEventListener("click", function(){
                alert("Hello Students!")
            });
        </script>
    </body>
</html>

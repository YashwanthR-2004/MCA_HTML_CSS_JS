<!DOCTYPE html>
<html>
    <head>
        <title>My Form</title>
        <style>
            h1{
                text-align: center ;
                color: rgb(9, 1, 1);
            }
             .form-box{
                background-color:rgb(233, 235, 224);
                padding: 20px;
                display: flex;
                flex-direction: column;
                width: 300px;
                margin: auto;
                gap: 10px;
                border: 3px solid black;
                border-radius: 10px;
                box-shadow: 0 0 10px rgb(213, 54, 54);
             }
             body{
                background-color:rgb(93, 128, 118);
             }
        </style>
        <body>
            <h1>Registration Form</h1>
            <form class="form-box" onsubmit="return validate()">
                <label>Name</label>
                <input type="text" id="name">
                <label>Email</label>
                <input type="email" id="email">
                <label>Password</label>
                <input type="password" id="password">
                <button type="Submit">Submit</button>
            </form> 
            <script>
                function validate(){
                    let name = document.getElementById("name").value;
                    let email = document.getElementById("email").value;
                    let password = document.getElementById("password").value;
                    let pattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[@#$%&!])(?=.*\d).{8,}$/

                    if(name == "" || email == "" || password == ""){
                        alert("All Fields Required");
                        return false;
                    }
                    if(!pattern.test(password)){
                        alert("password must contain 1 capital letter, 1 small letter,1 special chaaracter, 1 digit and minimum 8 length");
                        return false;
                    }
                    alert("Form Submitted Successfully");
                    return true;
                }
            </script>
        </body>
    </head>
</html>
